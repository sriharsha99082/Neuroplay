<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroPlay - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <div class="stage">
        <div class="container">

            <div class="logo">
                <div class="logo-icon">🧠</div>
                <h1>NeuroPlay</h1>
            </div>

            <p class="tagline">Play. Learn. Discover.</p>

            <div class="signup-box">

                <h2>Create Account</h2>
                <p class="subtitle">Join NeuroPlay and start your journey!</p>

                <form id="signupForm">

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username"
                               placeholder="Enter username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password"
                               placeholder="Create password"
                               minlength="6" required>
                        <small>Password must contain at least 6 characters.</small>
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label for="age">Age</label>
                            <input type="number" id="age"
                                   placeholder="Your age"
                                   min="7" max="17" required>
                        </div>

                        <div class="input-group">
                            <label for="gender">Gender</label>
                            <select id="gender" required>
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <p id="message"></p>

                    <button type="submit">CREATE ACCOUNT</button>
                </form>

                <div class="login-section">
                    <p>Already registered?</p>
                    <a href="../login/login.html" class="login-button">LOGIN HERE →</a>
                </div>

            </div>

        </div>
    </div>

    <script src="signup.js"></script>

</body>
</html>
