<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroPlay - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="stage">
        <div class="container">

            <div class="logo">
                <div class="logo-icon">🧠</div>
                <h1>NeuroPlay</h1>
            </div>

            <p class="tagline">Play. Learn. Discover.</p>

            <div class="login-box">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to continue your journey</p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username"
                               placeholder="Enter your username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password"
                               placeholder="Enter your password"
                               minlength="6" required>
                        <small class="password-hint">
                            Password must contain at least 6 characters.
                        </small>
                    </div>

                    <p id="message"></p>

                    <button type="submit">LOGIN</button>
                </form>

                <p class="signup-text">
                    Don't have an account?
                    <a href="../signup/signup.html">Create Account</a>
                </p>
            </div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
